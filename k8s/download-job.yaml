apiVersion: batch/v1
kind: Job
metadata:
  name: download-model
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: downloader
          image: model-downloader:0.1
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: model-config
          volumeMounts:
            - name: weights
              mountPath: /models
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: model-storage
